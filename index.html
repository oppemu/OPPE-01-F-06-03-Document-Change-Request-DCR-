<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึก DCR / OPPE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- โลโก้และหัวข้อ -->
        <div class="header">
            <img src="LOGO.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <h2>แบบฟอร์มบันทึก DCR / OPPE</h2>
        </div>

        <form id="oppeForm">
            <!-- 1. ค้นหาผู้ใช้งานด้วยอีเมล -->
            <div class="card">
                <h3>1. ข้อมูลผู้บันทึก</h3>
                <div class="form-group">
                    <label for="email">อีเมล (E-mail):</label>
                    <div class="input-inline">
                        <input type="email" id="email" required placeholder="example@domain.com">
                        <button type="button" id="btnCheckEmail" onclick="handleCheckEmail()">ตรวจสอบ</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reporterName">ชื่อ-นามสกุล:</label>
                    <input type="text" id="reporterName" readonly placeholder="จะแสดงอัตโนมัติเมื่อพบอีเมล">
                </div>
                <div class="form-group">
                    <label for="position">ตำแหน่ง:</label>
                    <input type="text" id="position" readonly placeholder="จะแสดงอัตโนมัติ">
                </div>
                <div class="form-group">
                    <label for="department">งาน/หน่วยงาน:</label>
                    <input type="text" id="department" readonly placeholder="จะแสดงอัตโนมัติ">
                </div>
            </div>

            <!-- 2. ข้อมูลการดำเนินการ -->
            <div class="card">
                <h3>2. ข้อมูลการดำเนินการ / เอกสาร</h3>
                <div class="form-group">
                    <label for="entryDate">วันที่ดำเนินการ:</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div class="form-group">
                    <label for="operationsName">ประเภท/สถานที่ดำเนินการ:</label>
                    <input type="text" id="operationsName" placeholder="ระบุประเภทหรือสถานที่" required>
                </div>
                <div class="form-group">
                    <label for="categoryInput">หมวดงาน:</label>
                    <select id="categoryInput" onchange="handleCategoryChange()" required>
                        <option value="">-- กำลังโหลดหมวดงาน... --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pwiInput">ชื่อระเบียบปฏิบัติ (P/WI):</label>
                    <select id="pwiInput" required disabled>
                        <option value="">-- กรุณาเลือกหมวดงานก่อน --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">ชื่อเอกสาร / เรื่องที่ดำเนินการ:</label>
                    <input type="text" id="subject" onchange="handleSubjectChange()" required placeholder="ระบุชื่อเรื่อง">
                </div>
                <div class="form-row">
                    <div class="form-group col">
                        <label for="currentVisit">จำนวนครั้งที่ดำเนินการเดิม:</label>
                        <input type="number" id="currentVisit" value="0" readonly>
                    </div>
                </div>
                <div class="form-group">
                    <label for="jobDetailInput">รายละเอียดการดำเนินงาน:</label>
                    <textarea id="jobDetailInput" rows="4" placeholder="กรอกรายละเอียด..."></textarea>
                </div>
                <div class="form-group">
                    <label for="attachFile">แนบไฟล์ประกอบ (ถ้ามี):</label>
                    <input type="file" id="attachFile">
                </div>
            </div>

            <!-- ปุ่มบันทึก -->
            <div class="form-actions">
                <button type="submit" id="btnSubmit">บันทึกข้อมูล</button>
            </div>
        </form>
    </div>

    <!-- สคริปต์เชื่อมต่อ -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
