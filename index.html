<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบร้องขอแก้ไขเอกสาร (DCR)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-logo">
            <img src="LOGO.png" alt="Logo" onerror="this.style.display='none'">
            <h2>ใบร้องขอแก้ไขเอกสาร (Document Change Request : DCR)</h2>
        </div>

        <form id="dcrForm">
            <!-- ส่วนที่ 1: ข้อมูลผู้ร้องขอแก้ไข -->
            <div class="form-section">
                <h3>1. ข้อมูลผู้ร้องขอแก้ไข</h3>
                <div class="form-group">
                    <label for="email">EMAIL:</label>
                    <div class="search-box">
                        <input type="email" id="email" placeholder="กรอกอีเมลเพื่อค้นหา" required>
                        <button type="button" id="btnCheckEmail" class="btn-search" onclick="handleCheckEmail()">ตรวจสอบ</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reporterName">ชื่อ-นามสกุล (ผู้ขอแก้ไข):</label>
                    <input type="text" id="reporterName" placeholder="ระบบดึงให้อัตโนมัติ" readonly>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="position">ตำแหน่ง:</label>
                        <input type="text" id="position" placeholder="ระบบดึงให้อัตโนมัติ" readonly>
                    </div>
                    <div class="form-group">
                        <label for="deptCode">รหัสหน่วยงาน:</label>
                        <input type="text" id="deptCode" placeholder="ระบบดึงให้อัตโนมัติ" readonly>
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2 และ 3 (ซ่อนไว้ก่อน เปิดใช้งานเมื่อค้นพบชื่อ) -->
            <div id="restOfForm" style="display: none;">
                
                <!-- ส่วนที่ 2: การดำเนินการและหมวดหมู่ออกเอกสาร -->
                <div class="form-section">
                    <h3>2. การดำเนินการและหมวดหมู่ออกเอกสาร</h3>
                    <div class="form-group">
                        <label for="entryDate">วันที่ดำเนินการ:</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="form-group">
                        <label for="operationsName">ประเภทการดำเนินการ:</label>
                        <select id="operationsName" required>
                            <option value="ขึ้นทะเบียนใหม่">ขึ้นทะเบียนใหม่</option>
                            <option value="แก้ไข">แก้ไข</option>
                            <option value="ยกเลิก">ยกเลิก</option>
                            <option value="ทบทวน">ทบทวน</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="categoryInput">ลำดับหมวด/ชื่อหมวดงาน:</label>
                        <select id="categoryInput" onchange="handleCategoryChange()" required>
                            <option value="">-- เลือกหมวดงาน --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pwiInput">ชื่อระเบียบปฏิบัติ:</label>
                        <select id="pwiInput" disabled required>
                            <option value="">-- กรุณาเลือกหมวดงานก่อน --</option>
                        </select>
                    </div>
                </div>

                <!-- ส่วนที่ 3: รายละเอียดเอกสารที่ขอแก้ไข -->
                <div class="form-section">
                    <h3>3. รายละเอียดเอกสารที่ขอแก้ไข</h3>
                    <div class="form-group">
                        <label for="docType">ประเภทเอกสาร:</label>
                        <select id="docType" required>
                            <option value="ระเบียบปฏิบัติ (Procedure - P)">ระเบียบปฏิบัติ (Procedure - P)</option>
                            <option value="คู่มือการทำงาน (Work Instruction - W)">คู่มือการทำงาน (Work Instruction - W)</option>
                            <option value="แบบฟอร์ม (Form - F)">แบบฟอร์ม (Form - F)</option>
                            <option value="เอกสารสนับสนุน (Supporting Document - S)">เอกสารสนับสนุน (Supporting Document - S)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="docCode">รหัสเอกสาร:</label>
                        <input type="text" id="docCode" placeholder="เช่น OPPE-01-P-01" required>
                    </div>
                    <div class="form-group">
                        <label for="docName">ชื่อเอกสาร:</label>
                        <input type="text" id="docName" placeholder="กรอกชื่อเอกสาร" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="oldRev">ครั้งที่แก้ไข (เดิม):</label>
                            <input type="text" id="oldRev" value="00" required>
                        </div>
                        <div class="form-group">
                            <label for="newRev">แก้ไขเอกสารครั้งที่ (ใหม่):</label>
                            <input type="text" id="newRev" value="01" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="changeDetail">รายละเอียดที่แก้ไข / เหตุผลการร้องขอ:</label>
                        <textarea id="changeDetail" rows="4" placeholder="ระบุรายละเอียด..." required></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn-submit">บันทึกข้อมูล DCR</button>
                </div>

            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
